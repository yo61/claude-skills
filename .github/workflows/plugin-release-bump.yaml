name: Plugin release bump

# Receives a `repository_dispatch: plugin-released` event from one of the plugin
# repos when it cuts a new release. Bumps that plugin's `source.ref` in
# marketplace.json, opens a `fix(<plugin>): bump to <tag>` PR, and enables
# auto-merge so the PR ships once CI passes. release-please then picks up the
# fix: commit on main and cuts the next marketplace patch release.

on:
  repository_dispatch:
    types: [plugin-released]

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          # Scope the token to this repo only and drop everything else
          # from the blanket installation grant.
          owner: ${{ github.repository_owner }}
          repositories: claude-skills
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Don't persist credentials in .git/config (avoids leaking the App
          # token through artifacts or subsequent steps). Nothing below uses git
          # for auth: the commit is made through the API, not pushed.
          persist-credentials: false

      - name: Bump marketplace.json and open auto-merge PR
        env:
          # Payload values from the dispatching plugin repo. Treated as
          # untrusted — validated against tight regexes before any use.
          PLUGIN: ${{ github.event.client_payload.plugin }}
          TAG: ${{ github.event.client_payload.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FILE: .claude-plugin/marketplace.json
        run: |
          set -euo pipefail

          # Validate dispatch payload shape.
          if ! printf '%s' "$PLUGIN" | grep -qE '^[a-z0-9][a-z0-9-]*[a-z0-9]$'; then
            echo "::error::invalid plugin name from dispatch: $PLUGIN"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid tag from dispatch: $TAG"
            exit 1
          fi

          # Verify the plugin exists in marketplace.json.
          current_ref=$(jq -r --arg p "$PLUGIN" \
            '.plugins[] | select(.name==$p) | .source.ref // empty' \
            .claude-plugin/marketplace.json)
          if [ -z "$current_ref" ]; then
            echo "::error::plugin '$PLUGIN' is not in marketplace.json"
            exit 1
          fi

          # Idempotent: skip if already at this tag.
          if [ "$current_ref" = "$TAG" ]; then
            echo "marketplace.json already pins $PLUGIN at $TAG; nothing to do"
            exit 0
          fi

          # Apply the bump.
          jq --arg p "$PLUGIN" --arg t "$TAG" \
            '(.plugins[] | select(.name==$p) | .source.ref) = $t' \
            .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.new
          mv .claude-plugin/marketplace.json.new .claude-plugin/marketplace.json

          # Commit through GraphQL createCommitOnBranch, so GitHub builds and
          # SIGNS the commit server-side.
          #
          # main requires signed commits. A plain `git commit` here is unsigned,
          # so the PR this opens can never merge -- and the App being a bypass
          # actor on that ruleset does not help, because the last step enables
          # AUTO-merge, and auto-merge ignores bypass actors. The PRs simply sat
          # BLOCKED, silently, three of them before anyone noticed.
          #
          # The Contents REST API does NOT sign; only createCommitOnBranch and
          # the web UI do. Same mechanism as homebrew-tap's commit-recipe-pr
          # action, for the same reason.
          BRANCH="auto/bump-${PLUGIN}-${TAG}"

          # A re-dispatch of the same release must not add a second commit to a
          # branch that already carries this bump.
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "branch ${BRANCH} already exists; nothing to do"
            exit 0
          fi

          # createCommitOnBranch commits onto an EXISTING branch, so create it
          # at main's HEAD first; the mutation then adds the one commit.
          base_sha=$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)
          gh api -X POST "repos/${REPO}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="$base_sha" > /dev/null

          jq -nc \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$base_sha" \
            --arg headline "fix(${PLUGIN}): bump to ${TAG}" \
            --arg path "$FILE" \
            --arg contents "$(base64 -w0 "$FILE")" \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables:{input:{
                branch:{repositoryNameWithOwner:$repo,branchName:$branch},
                message:{headline:$headline},
                expectedHeadOid:$oid,
                fileChanges:{additions:[{path:$path,contents:$contents}]}}}}' \
            | gh api graphql --input - > /dev/null

          # Open PR + enable auto-merge. PR is App-authored (via GH_TOKEN env),
          # so it triggers pull_request workflow events and CI runs on it.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(${PLUGIN}): bump to ${TAG}" \
            --body "Auto-bump from \`${PLUGIN}\` release ${TAG} via repository_dispatch from the plugin repo."

          gh pr merge "$BRANCH" --auto --merge
